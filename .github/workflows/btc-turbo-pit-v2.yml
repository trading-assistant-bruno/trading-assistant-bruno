name: BTC turbo PIT v2

on:
  push:
    branches:
      - btc-turbo-point-in-time
    paths:
      - 'src/btc_turbo_pit_v2.py'
      - '.github/workflows/btc-turbo-pit-v2.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - run: python src/btc_turbo_pit_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-turbo-pit-v2-results
          path: |
            data/btc_turbo_pit_v2/results.csv
            data/btc_turbo_pit_v2/results.json
            data/btc_turbo_pit_v2/annual.csv
            data/btc_turbo_pit_v2/equity.csv
            data/btc_turbo_pit_v2/selection_log.csv
            data/btc_turbo_pit_v2/snapshots.csv
            data/btc_turbo_pit_v2/failures.csv
