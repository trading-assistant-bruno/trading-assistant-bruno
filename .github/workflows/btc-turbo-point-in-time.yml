name: BTC turbo point-in-time backtest

on:
  push:
    branches:
      - btc-turbo-point-in-time
    paths:
      - 'src/btc_turbo_point_in_time.py'
      - '.github/workflows/btc-turbo-point-in-time.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - run: python src/btc_turbo_point_in_time.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-turbo-point-in-time-results
          path: |
            data/btc_turbo_point_in_time/results.csv
            data/btc_turbo_point_in_time/results.json
            data/btc_turbo_point_in_time/annual_returns_pct.csv
            data/btc_turbo_point_in_time/equity_curves.csv
            data/btc_turbo_point_in_time/snapshot_universe.csv
            data/btc_turbo_point_in_time/snapshot_failures.csv
            data/btc_turbo_point_in_time/price_coverage_by_symbol.csv
            data/btc_turbo_point_in_time/daily_coverage.csv
