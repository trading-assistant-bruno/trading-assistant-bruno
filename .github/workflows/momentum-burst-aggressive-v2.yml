name: Momentum Burst aggressive v2

on:
  workflow_dispatch:
  push:
    branches:
      - momentum-burst-backtest
    paths:
      - 'src/momentum_burst_aggressive_v2.py'
      - '.github/workflows/momentum-burst-aggressive-v2.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install msci-data==1.0.0
      - run: python src/momentum_burst_aggressive_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-burst-aggressive-v2-results
          path: |
            data/momentum_burst_aggressive_v2/results.csv
            data/momentum_burst_aggressive_v2/results.json
            data/momentum_burst_aggressive_v2/annual_returns_pct.csv
            data/momentum_burst_aggressive_v2/equity_curves.csv
            data/momentum_burst_aggressive_v2/closed_trades.csv
            data/momentum_burst_aggressive_v2/fills.csv
            data/momentum_burst_aggressive_v2/world_aggressive_blends.csv
            data/momentum_burst_aggressive_v2/weekly_gate_features.csv
            data/momentum_burst_aggressive_v2/universe_coverage.csv
            data/momentum_burst_aggressive_v2/subperiod_results.csv
          if-no-files-found: warn
