name: Daily market scan

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron est en UTC.
    # 20:17 UTC correspond à 22:17 Paris en heure d'été.
    # 21:17 UTC correspond à 22:17 Paris en heure d'hiver.
    - cron: "17 20 * * 1-5"
    - cron: "17 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check Paris schedule
        id: timing
        shell: bash
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: scanner enabled."
            exit 0
          fi

          PARIS_OFFSET=$(TZ=Europe/Paris date +%z)

          if [ "$PARIS_OFFSET" = "+0200" ] && [ "$TRIGGER_SCHEDULE" = "17 20 * * 1-5" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Summer schedule selected (20:17 UTC -> 22:17 Paris)."
          elif [ "$PARIS_OFFSET" = "+0100" ] && [ "$TRIGGER_SCHEDULE" = "17 21 * * 1-5" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Winter schedule selected (21:17 UTC -> 22:17 Paris)."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate schedule. Trigger=${TRIGGER_SCHEDULE}, Paris offset=${PARIS_OFFSET}."
          fi

      - name: Checkout repository
        if: steps.timing.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.timing.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.timing.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run scanner
        if: steps.timing.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py

      - name: Commit report and persistent cache
        if: steps.timing.outputs.should_run == 'true'
        run: |
          git config user.name "trading-assistant-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/index.html data/latest.json data/earnings_cache.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily trading report"
          else
            echo "No report change to commit"
          fi

          git reset --hard HEAD
          git clean -fd

          git pull --rebase origin main
          git push origin HEAD:main
