name: Daily market scan

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC = 22:30 Paris in winter / 23:30 in summer.
    # GitHub cron uses UTC; adjust seasonally if exact timing matters.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py
     - name: Commit report
  run: |
    git config user.name "trading-assistant-bot"
    git config user.email "actions@users.noreply.github.com"
    git add docs/index.html data/latest.json
    git diff --cached --quiet || git commit -m "Update daily trading report"
    git pull --rebase origin main
    git push origin main
