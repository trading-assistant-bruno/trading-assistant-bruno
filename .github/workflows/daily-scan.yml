name: Daily market scan

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron est en UTC.
    # On programme les deux heures possibles correspondant à 22h05 à Paris
    # (heure d'été / heure d'hiver), puis on garde uniquement l'exécution
    # dont l'heure locale Europe/Paris est bien 22h.
    - cron: "5 20 * * 1-5"
    - cron: "5 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check Paris schedule
        id: timing
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: scanner enabled."
            exit 0
          fi

          PARIS_HOUR=$(TZ=Europe/Paris date +%H)

          if [ "$PARIS_HOUR" = "22" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run matches 22:05 Europe/Paris."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC schedule; Paris hour is ${PARIS_HOUR}."
          fi

      - name: Checkout repository
        if: steps.timing.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.timing.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.timing.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run scanner
        if: steps.timing.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py

      - name: Commit report and persistent cache
        if: steps.timing.outputs.should_run == 'true'
        run: |
          git config user.name "trading-assistant-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/index.html data/latest.json data/earnings_cache.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily trading report"
          else
            echo "No report change to commit"
          fi

          git reset --hard HEAD
          git clean -fd

          git pull --rebase origin main
          git push origin HEAD:main
