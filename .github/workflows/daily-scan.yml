name: Daily market scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

# Évite que deux scans essaient de mettre à jour le dépôt en même temps.
concurrency:
  group: daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py

      - name: Commit report and persistent cache
        run: |
          git config user.name "trading-assistant-bot"
          git config user.email "actions@users.noreply.github.com"

          # On ne commit que les fichiers produits volontairement par le scanner.
          git add docs/index.html data/latest.json data/earnings_cache.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily trading report"
          else
            echo "No report change to commit"
          fi

          # Le runner GitHub est éphémère.
          # Toute modification restante est donc un fichier temporaire/non voulu
          # et ne doit pas bloquer le rebase.
          git reset --hard HEAD
          git clean -fd

          git pull --rebase origin main
          git push origin HEAD:main
