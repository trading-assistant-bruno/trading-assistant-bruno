name: BTC turbo PIT monthly
on:
  push:
    branches: [btc-turbo-point-in-time]
    paths: ['src/btc_turbo_pit_monthly.py','.github/workflows/btc-turbo-pit-monthly.yml']
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - run: python src/btc_turbo_pit_monthly.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-turbo-pit-monthly-results
          path: |
            data/btc_turbo_pit_monthly/results.csv
            data/btc_turbo_pit_monthly/results.json
            data/btc_turbo_pit_monthly/annual.csv
            data/btc_turbo_pit_monthly/equity.csv
            data/btc_turbo_pit_monthly/selection_log.csv
            data/btc_turbo_pit_monthly/snapshots.csv
            data/btc_turbo_pit_monthly/failures.csv
