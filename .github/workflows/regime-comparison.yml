name: Bull bear regime comparison

on:
  workflow_dispatch:
  push:
    branches: [dca-benchmark-comparison]
    paths:
      - "src/regime_comparison.py"
      - ".github/workflows/regime-comparison.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/regime_comparison.py
      - uses: actions/upload-artifact@v4
        with:
          name: regime-comparison-results
          path: |
            data/regime_comparison/regime_conditional_returns.csv
            data/regime_comparison/dca_purchase_regime_cohorts.csv
            data/regime_comparison/btc_regime_episodes.csv
            data/regime_comparison/regime_comparison.json
