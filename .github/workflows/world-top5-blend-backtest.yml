name: World Top-5 blend backtest

on:
  workflow_dispatch:
  push:
    branches: [world-top5-backtest]
    paths:
      - "src/world_top5_blend_backtest.py"
      - "src/world_top5_annual_cmc.py"
      - ".github/workflows/world-top5-blend-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/world_top5_blend_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: world-top5-blend-results
          path: |
            data/world_top5_blend/blend_results.csv
            data/world_top5_blend/blend_results.json
            data/world_top5_blend/blend_equity_curves.csv
            data/world_top5_blend/blend_annual_returns_pct.csv
            data/world_top5_blend/annual_top5_rankings.csv
