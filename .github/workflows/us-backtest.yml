name: US strategy backtest

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/us_backtest.py"
      - "us_backtest_config.yml"
      - ".github/workflows/us-backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install lxml

      - name: Run US backtest
        run: python src/us_backtest.py

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: us-backtest-results
          path: |
            data/us_backtest/backtest_results.csv
            data/us_backtest/backtest_annual_returns.csv
            data/us_backtest/backtest_metadata.json
            data/us_backtest/backtest_results.json
            data/us_backtest/trades_*.csv

      - name: Commit results on branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "trading-assistant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/us_backtest
          if ! git diff --cached --quiet; then
            git commit -m "Update US backtest results"
            git push
          else
            echo "No result changes to commit"
          fi
