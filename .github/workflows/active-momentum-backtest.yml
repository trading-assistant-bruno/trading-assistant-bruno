name: Active momentum backtest

on:
  workflow_dispatch:
  push:
    branches:
      - active-momentum-backtest
    paths:
      - 'src/active_momentum_backtest.py'
      - '.github/workflows/active-momentum-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install msci-data==1.0.0
      - run: python src/active_momentum_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-momentum-backtest-results
          path: |
            data/active_momentum/results.csv
            data/active_momentum/results.json
            data/active_momentum/subperiod_results.csv
            data/active_momentum/annual_returns_pct.csv
            data/active_momentum/equity_curves.csv
            data/active_momentum/trades.csv
            data/active_momentum/universe_coverage.csv
          if-no-files-found: warn
