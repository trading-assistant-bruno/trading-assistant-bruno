name: Concentrated momentum rotation

on:
  workflow_dispatch:
  push:
    branches:
      - momentum-burst-backtest
    paths:
      - 'src/momentum_concentrated_rotation.py'
      - '.github/workflows/momentum-concentrated-rotation.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install msci-data==1.0.0
      - run: python src/momentum_concentrated_rotation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-concentrated-rotation-results
          path: |
            data/momentum_concentrated_rotation/results.csv
            data/momentum_concentrated_rotation/results.json
            data/momentum_concentrated_rotation/annual_returns_pct.csv
            data/momentum_concentrated_rotation/equity_curves.csv
            data/momentum_concentrated_rotation/world_satellite_blends.csv
            data/momentum_concentrated_rotation/subperiod_results.csv
            data/momentum_concentrated_rotation/transactions.csv
          if-no-files-found: warn
