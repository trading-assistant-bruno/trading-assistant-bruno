name: BTC turbo stop comparison

on:
  push:
    branches: [btc-turbo-point-in-time]
    paths:
      - 'src/btc_turbo_stop_test.py'
      - '.github/workflows/btc-turbo-stop-test.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt lxml html5lib
      - run: python src/btc_turbo_stop_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-turbo-stop-test-results
          path: |
            data/btc_turbo_stop_test/results.csv
            data/btc_turbo_stop_test/results.json
            data/btc_turbo_stop_test/annual.csv
            data/btc_turbo_stop_test/equity.csv
            data/btc_turbo_stop_test/trade_log.csv
            data/btc_turbo_stop_test/signals.csv
            data/btc_turbo_stop_test/daily_coverage.csv
            data/btc_turbo_stop_test/missing_daily_paths.csv
            data/btc_turbo_stop_test/snapshots.csv
            data/btc_turbo_stop_test/snapshot_failures.csv
          if-no-files-found: warn
