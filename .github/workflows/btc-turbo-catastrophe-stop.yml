name: BTC turbo catastrophe stop
on:
  push:
    branches: [btc-turbo-point-in-time]
    paths: ['src/btc_turbo_catastrophe_stop.py','.github/workflows/btc-turbo-catastrophe-stop.yml']
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - name: Download validated PIT seed
        uses: actions/download-artifact@v4
        with:
          name: btc-turbo-pit-monthly-results
          repository: trading-assistant-bruno/trading-assistant-bruno
          run-id: 33550218516
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: seed
      - run: python src/btc_turbo_catastrophe_stop.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-turbo-catastrophe-stop-results
          path: data/btc_turbo_catastrophe_stop/
