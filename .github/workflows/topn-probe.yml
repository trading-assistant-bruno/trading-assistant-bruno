name: TopN probe

on:
  workflow_dispatch:
  push:
    branches:
      - topn-backtest
    paths:
      - 'src/topn_probe.py'
      - '.github/workflows/topn-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python src/topn_probe.py
